<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爆裂！うんこインベーダー（ヒントなし版）</title>
<style>
:root{--s:1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;text-align:center;font-family:sans-serif;background:#050505;color:#fff;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));user-select:none;overflow-x:hidden;touch-action:manipulation}
#hud{width:min(100%,520px);margin:0 auto 6px;padding:6px;border:1px dashed #ffeb3b;border-radius:8px;background:#111;color:#ffeb3b;font-weight:bold;font-size:clamp(12px,3.1vw,16px);display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px 10px}
#hud span{white-space:nowrap}
#soundBtn{border:1px solid #ffeb3b;border-radius:6px;background:#191919;color:#ffeb3b;font:inherit;font-size:14px;line-height:1;padding:3px 6px;cursor:pointer}
#rank{color:#00ffcc}
#lv{color:#ff9800}
.col{display:flex;flex-direction:column;align-items:center;width:min(100%,96vw);margin:0 auto;gap:6px}
.shell{position:relative;width:400px;height:460px;max-width:100%}
#stage{width:400px;height:460px;position:relative;overflow:hidden;background:#1a0f00;border:4px solid #ffeb3b;border-radius:12px;transform:scale(var(--s));transform-origin:top left;touch-action:none;cursor:pointer;will-change:transform;contain:layout paint}
#question{position:absolute;top:6px;left:4px;right:4px;z-index:9;padding:6px;border:1px solid #ffeb3b;border-radius:6px;background:rgba(0,0,0,.65);font-size:clamp(22px,7.5vw,30px);font-weight:bold;min-height:40px;line-height:1.2;pointer-events:none}
#msg{position:absolute;bottom:4px;left:4px;right:4px;z-index:9;font-size:clamp(11px,3.3vw,14px);font-weight:bold;color:#ffeb3b;background:rgba(0,0,0,.62);border-radius:6px;padding:3px 4px;min-height:20px;line-height:1.25;pointer-events:none}
#combo{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:11;font-size:27px;font-weight:bold;color:#ff9800;text-shadow:0 0 8px #000,0 0 14px #ffeb3b;opacity:0;pointer-events:none;transition:.15s;white-space:nowrap}
#combo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#player{position:absolute;bottom:36px;left:180px;font-size:40px;z-index:5;transition:transform .1s,filter .3s}
#player.r0{filter:none}
#player.r1{filter:drop-shadow(0 0 6px #ffeb3b)}
#player.r2{filter:drop-shadow(0 0 10px #ff9800) drop-shadow(0 0 4px #ff5722)}
#player.r3{filter:drop-shadow(0 0 8px #ff00ea) drop-shadow(0 0 12px #00e5ff) drop-shadow(0 0 16px #ffeb3b)}
#player.r4{filter:drop-shadow(0 0 10px #33ff00) drop-shadow(0 0 14px #00ffcc) drop-shadow(0 0 18px #ffeb3b)}
#player.r5{filter:drop-shadow(0 0 10px #00bfff) drop-shadow(0 0 16px #7c4dff) drop-shadow(0 0 20px #ffffff)}
#player.r6{filter:drop-shadow(0 0 12px #ff0055) drop-shadow(0 0 18px #ffeb3b) drop-shadow(0 0 24px #00e5ff) drop-shadow(0 0 30px #ff00ea)}
#laser,.eshot{position:absolute;font-size:24px;z-index:4}
.eshot{font-size:30px}
.giant{font-size:46px!important}
.poop-final{font-size:64px!important;filter:drop-shadow(0 0 12px #6b4c00) drop-shadow(0 0 20px #ffeb3b) drop-shadow(0 0 28px #ff9800);animation:poopSpin .5s linear infinite}
@keyframes poopSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
#army{position:absolute;top:56px;left:0;right:0;height:100px}
.inv{font-size:55px;text-align:center;font-weight:bold;position:absolute;transition:filter .2s}
.inv.rainbow{animation:rb 1s linear infinite}
@keyframes rb{0%{filter:drop-shadow(0 0 6px #ff0000)}20%{filter:drop-shadow(0 0 6px #ff9800)}40%{filter:drop-shadow(0 0 6px #ffeb3b)}60%{filter:drop-shadow(0 0 6px #33ff00)}80%{filter:drop-shadow(0 0 6px #00bfff)}100%{filter:drop-shadow(0 0 6px #cc00ff)}}
.badge{font-size:14px;font-weight:bold;color:#fff;background:rgba(0,0,0,.8);border:1px solid #ffeb3b;padding:2px 6px;border-radius:4px;display:block;margin-top:-5px}
.badge.rb{border-color:#ff00ea;color:#ffeb3b}
.splash{position:absolute;font-size:30px;z-index:10;pointer-events:none}
.big{position:absolute;font-size:130px;z-index:6;line-height:1;pointer-events:none}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;z-index:9;pointer-events:none;box-shadow:0 0 10px currentColor}
.boss{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:8;font-size:80px;line-height:1;text-align:center;filter:drop-shadow(0 0 16px rgba(255,152,0,.7));transition:top .45s ease,font-size .45s ease}
.boss .badge{position:absolute;top:-6px;right:-14px;font-size:13px;margin-top:0;border-width:2px;white-space:nowrap;z-index:8}
.boss-hp{position:absolute;left:30px;right:30px;top:56px;height:18px;border:2px solid #ff9800;border-radius:999px;background:rgba(0,0,0,.55);z-index:8;overflow:hidden;display:flex;align-items:center;justify-content:center}
.fb-timerwrap{position:absolute;left:20px;right:20px;top:96px;height:8px;border:1px solid #00e5ff;border-radius:999px;background:rgba(0,0,0,.5);z-index:9;overflow:hidden;display:none}
.fb-timerbar{height:100%;width:100%;background:linear-gradient(90deg,#00e5ff,#ffeb3b,#ff0055);transition:width .05s linear}
.fb-phaselabel{position:absolute;left:4px;right:4px;top:78px;z-index:9;font-size:11px;font-weight:bold;color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,.5);text-align:center;pointer-events:none;line-height:1.1}
.fb-flash{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#ffeb3b;font-size:20px;font-weight:bold;text-align:center;white-space:pre-line;padding:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.fb-flash.show{opacity:1}
.fb-approach{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 20%,rgba(255,0,85,.5),rgba(255,0,85,0) 70%);transition:opacity .3s}
.fb-approach.show{opacity:1}
.fb-result{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,rgba(0,12,20,.92),rgba(0,0,0,.92))}
.fb-dance-stage{position:absolute;top:0;left:0;right:0;height:120px;overflow:hidden;pointer-events:none}
.fb-dancer{position:absolute;bottom:6px;font-size:34px;line-height:1;animation:fbDance 0.55s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,235,59,.6))}
@keyframes fbDance{0%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-18px) rotate(10deg)}100%{transform:translateY(0) rotate(-14deg)}}
.fb-confetti{position:absolute;top:-10px;font-size:16px;animation:fbConfettiFall linear forwards}
@keyframes fbConfettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(140px) rotate(480deg);opacity:0}}
.fb-result.show{display:flex}
.fb-result h2{color:#00e5ff;font-size:26px;margin:0;text-shadow:0 0 12px rgba(0,229,255,.6)}
.fb-result-stats{color:#ffeb3b;font-size:13px;line-height:1.6}
.fb-postbtn{min-width:170px;padding:8px 12px;border:2px solid #00e5ff;border-radius:8px;background:#0b1b2f;color:#00e5ff;font-size:14px;font-weight:bold;cursor:pointer;margin-top:2px}
.fb-postbtn:active{background:#123047}
.boss-hp-fill{position:absolute;inset:0;height:100%;width:100%;background:linear-gradient(90deg,#ff5722,#ffeb3b,#00ffcc);transition:width .2s ease;z-index:0}
.boss-hp-label{position:relative;z-index:1;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;line-height:1;white-space:nowrap}
.continue-panel{position:absolute;left:6px;right:6px;top:58px;z-index:13;border:2px solid #00e5ff;border-radius:14px;background:linear-gradient(180deg,rgba(0,12,20,.82),rgba(0,0,0,.72));padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;width:calc(100% - 12px)}
.continue-title{font-size:17px;font-weight:bold;color:#00e5ff;text-shadow:0 0 8px rgba(0,229,255,.35)}
.continue-sub{font-size:11px;color:#ffeb3b;line-height:1.3;max-width:28em}
.continue-status{font-size:14px;font-weight:bold;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(0,229,255,.55);padding:2px 8px;border-radius:999px}
.ufo{position:absolute;z-index:14;font-size:48px;text-align:center;line-height:1;filter:drop-shadow(0 0 8px rgba(0,229,255,.55))}
.ufo .badge{font-size:19px;font-weight:900;border:2px solid #00e5ff;background:rgba(0,0,0,.94);color:#fff;margin-top:-2px;padding:3px 8px;min-width:42px;text-shadow:0 0 6px rgba(0,0,0,.9)}
#controls{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;width:min(100%,520px);margin:8px auto 0;touch-action:none}
.cbtn{min-height:56px;border:2px solid #ffeb3b;border-radius:8px;background:#171717;color:#ffeb3b;font:inherit;font-size:28px;font-weight:bold;box-shadow:inset 0 -3px 0 rgba(255,235,59,.16)}
.cbtn:active,.cbtn.press{background:#392b00;transform:translateY(1px)}
.cbtn.fire{color:#fff;background:#8d1c00;border-color:#ff9800}
@media (hover:hover) and (pointer:fine){#controls{display:none}}
@media (max-width:400px){.cbtn{min-height:50px;font-size:24px}#question{font-size:clamp(18px,7vw,25px)}.boss{font-size:96px}.ufo{font-size:42px}.ufo .badge{font-size:17px}}

.blockWrap{position:absolute;inset:0;z-index:12;background:linear-gradient(180deg,#07111d,#0b1b2f 55%,#07111d);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 6px 6px}
.blockTop{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:bold;font-size:12px;margin-bottom:6px;gap:6px}
.blockCanvas{position:relative;width:100%;flex:1;border:2px solid #00e5ff;border-radius:10px;background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), rgba(0,0,0,.2) 35%, rgba(0,0,0,.45) 100%);overflow:hidden}
.brick{position:absolute;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.paddle{position:absolute;bottom:10px;width:86px;height:14px;border-radius:999px;background:linear-gradient(180deg,#ffeb3b,#ff9800);box-shadow:0 0 10px rgba(255,235,59,.5)}
.ball{position:absolute;font-size:28px;line-height:1;z-index:6;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,152,0,.7))}

@media (max-height:620px) and (orientation:landscape){body{padding-top:max(3px,env(safe-area-inset-top));padding-bottom:max(3px,env(safe-area-inset-bottom))}#hud{margin-bottom:3px;padding:3px;font-size:12px}#controls{margin-top:4px}.cbtn{min-height:42px;font-size:22px}}
</style>
</head>
<body>
<div id="hud"><span id="score">SCORE: 0000</span><span id="best" style="color:#ff5722">🏆MAX: 0000</span><span id="rank">🌱 うんこ見習い</span><span id="lv">LV1</span><span id="xp">⭐正解: 0</span><button id="soundBtn" type="button" aria-label="音のオンオフ">🔊</button></div>
<div class="col">
<div class="shell" id="shell">
<div id="stage">
<div id="question"></div>
<div id="fbTimerWrap" class="fb-timerwrap"><div id="fbTimerBar" class="fb-timerbar"></div></div>
<div id="fbPhaseLabel" class="fb-phaselabel"></div>
<div id="army"></div>
<div id="laser" style="display:none">🔥</div>
<div id="player" class="r0">🚀</div>
<div id="combo"></div>
<div id="msg">ロケットの左右をタップで移動、的をタップで攻撃！PCは【←→】【スペース】も使えます</div>
<div id="fbApproach" class="fb-approach"></div>
<div id="fbFlash" class="fb-flash"></div>
<div id="fbResult" class="fb-result">
  <div id="fbDanceStage" class="fb-dance-stage"></div>
  <h2 id="fbResultTitle">CLEAR!</h2>
  <div id="fbResultStats" class="fb-result-stats"></div>
  <button class="fb-postbtn" id="fbBtnRetry">もう一度ラスボス</button>
  <button class="fb-postbtn" id="fbBtnRestart">はじめから</button>
</div>
</div>
</div>
<div id="controls" aria-label="スマホ操作" style="display:none"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const STAGE_W=400,STAGE_H=460,INV_TOP=56;
let ans=0,px=182,active=true,score=0,bulletActive=false,attackTimer=null,audioCtx=null,invadersData=[];
let weaponShots=0, weaponReady='🔥';
let highScore=0, rankXP=0, sessionCorrect=0, sessionGoal=3, rewardTier=0, dailySeed=0, soundEnabled=true;
let comboCount=0,currentRankIdx=0,isRainbowRound=false;
let questionShownAt=0;const FAST_ANSWER_MS=2000;
function markQuestionShown(){questionShownAt=performance.now();}
function isFastAnswer(){return questionShownAt>0 && (performance.now()-questionShownAt)<=FAST_ANSWER_MS;}
let answerHistory=[],difficultyBias=0;const DIFF_WINDOW=8,DIFF_TARGET_HIGH=.92,DIFF_TARGET_LOW=.75,DIFF_BIAS_MIN=-2,DIFF_BIAS_MAX=3;
const keysPressed={};
const RAINBOW_CHANCE=.12,NEAR_MISS=2,SURPRISE_BOSS_CHANCE=.06;
const MISSES_TO_CONTINUE=3, CONTINUE_GOAL=3;
let missCount=0,gameMode='normal',continueCorrect=0,continueChoices=[],bossState=null,levelCycle=0,continueSpeedTier=0,wrongContinueSpeedTier=0,continueFallTimer=null,blockState=null,blockTimer=null,continueOrigin='normal',savedBlockState=null;
let finalBossActive=false,finalBossCleared=false,finalBossBestTime=0,fbPhase=1,fbHp=4,fbMaxHp=4,fbTop=0,fbFontBase=86,fbTimerRAF=null,fbFallTimer=null,fbStartTime=0,fbMaxCombo=0,fbIsSurprise=false;

function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function isDailyReady(){return dailySeed!==getDailySeed()}
const RANKS=[
 {min:0,  label:'🌱 うんこ見習い',        ops:['+'],     range:[1,4],  rocket:'🚀', weapon:'🔥'},
 {min:6,  label:'💪 うんこ戦士',          ops:['+'],     range:[2,9],  rocket:'🚀', weapon:'⚡'},
 {min:15, label:'🔥 うんこマスター',       ops:['+','-'], range:[2,12], rocket:'🛸', weapon:'💥'},
 {min:28, label:'👑 伝説のうんこハンター',  ops:['+','-'], range:[2,18], rocket:'🛸', weapon:'☄️'},
 {min:45, label:'🌟 うんこ賢者',          ops:['+','-'], range:[3,24], rocket:'🚁', weapon:'🌪️'},
 {min:68, label:'💎 うんこ皇帝',          ops:['+','-'], range:[3,30], rocket:'🛰️', weapon:'⚔️'},
 {min:95, label:'👽 銀河うんこ帝王',       ops:['+','-'], range:[4,36], rocket:'🚀', weapon:'💩'}
];
const WEAPONS=RANKS.map(r=>r.weapon);
const DEFAULT_WEAPON='🔥';

const SAVE_KEY='unkoInvaderSaveV2';
function loadGame(){
  try{
    const data=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    highScore=Number(data.highScore)||0;
    rankXP=Math.max(0,Number(data.rankXP)||0);
    levelCycle=Math.max(0,Number(data.levelCycle)||0);
    soundEnabled=data.soundEnabled!==false;
    finalBossCleared=!!data.finalBossCleared;
    finalBossBestTime=Number(data.finalBossBestTime)||0;
  }catch(_){ }
}
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({highScore,rankXP,levelCycle,soundEnabled,finalBossCleared,finalBossBestTime}));}catch(_){ }
}
function updateSoundButton(){const b=$('soundBtn');if(b){b.textContent=soundEnabled?'🔊':'🔇';b.setAttribute('aria-label',soundEnabled?'音をオフ':'音をオン');}}


function getRankIndex(xp){let i=0;for(let k=0;k<RANKS.length;k++)if(xp>=RANKS[k].min)i=k;return i}
function getLevelNumber(){return currentRankIdx+1}
function isFinalLevel(){return getLevelNumber()===RANKS.length}
function updateRankDisplay(){
  currentRankIdx=getRankIndex(rankXP);
  $('rank').textContent=RANKS[currentRankIdx].label;
  $('lv').textContent='LV'+getLevelNumber();
  const p=$('player');
  p.classList.remove('r0','r1','r2','r3','r4','r5','r6');
  p.classList.add('r'+Math.min(currentRankIdx,6));
  p.textContent=RANKS[currentRankIdx].rocket;
  const modeText=gameMode==='continue'?` / CONTINUE ${continueCorrect}/${CONTINUE_GOAL}`:` / MISS ${missCount}/${MISSES_TO_CONTINUE}`;
  $('xp').textContent='⭐正解: '+sessionCorrect+' / '+sessionGoal+modeText+' / 武器:'+(weaponShots>0?weaponReady:RANKS[currentRankIdx].weapon)+' / 難易度:'+(difficultyBias>=0?'+':'')+difficultyBias;
  applyStageTheme();
  updateSoundButton();
}
function applyStageTheme(){
  const stage=$('stage'), army=$('army'), q=$('question');
  if(isFinalLevel()){
    stage.style.background='linear-gradient(180deg,#190028,#3b0a2a 48%, #13070a)';
    army.style.top='56px';
    q.style.fontSize='clamp(20px,7vw,28px)';
  }else{
    stage.style.background='#1a0f00';
    army.style.top='56px';
    q.style.fontSize='clamp(22px,7.5vw,30px)';
  }
}
function getComboMultiplier(c){return c>=5?3:c>=3?2:c>=2?1.5:1}
function recordAnswer(correct){
  answerHistory.push(correct?1:0);
  if(answerHistory.length>DIFF_WINDOW) answerHistory.shift();
  if(answerHistory.length>=4){
    const acc=answerHistory.reduce((a,b)=>a+b,0)/answerHistory.length;
    if(acc>DIFF_TARGET_HIGH && difficultyBias<DIFF_BIAS_MAX) difficultyBias++;
    else if(acc<DIFF_TARGET_LOW && difficultyBias>DIFF_BIAS_MIN) difficultyBias--;
  }
}
function showComboBadge(t){const b=$('combo');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),700)}
function resetCombo(){comboCount=0}

function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume()});
function playSound(f1,f2,type,vol,len){if(!soundEnabled||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);o.type=type;o.frequency.setValueAtTime(f1,now);if(f2)o.frequency.setValueAtTime(f2,now+.08);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.01,now+len);o.start(now);o.stop(now+len)}
function playWinSound(){if(!soundEnabled||!audioCtx)return;let now=audioCtx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+i*.08;o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.start(t);o.stop(t+.3)})}
function playComboSound(c){if(!soundEnabled||!audioCtx)return;let now=audioCtx.currentTime,base=700+c*60;for(let i=0;i<2;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+i*.06;o.connect(g);g.connect(audioCtx.destination);o.type='square';o.frequency.setValueAtTime(base+i*150,t);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.01,t+.12);o.start(t);o.stop(t+.12)}}
function playRainbowSound(){if(!soundEnabled||!audioCtx)return;let now=audioCtx.currentTime;[660,880,1100,1320,1760].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+i*.06;o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.25);o.start(t);o.stop(t+.25)})}

function generateQuestion(){
  const rank=RANKS[currentRankIdx];
  const op=rank.ops[Math.random()*rank.ops.length|0];
  const [lo,hiBase]=rank.range;
  const hi=Math.max(lo+1,hiBase+difficultyBias);
  let n1=lo+(Math.random()*(hi-lo+1)|0), n2=lo+(Math.random()*(hi-lo+1)|0);
  if(currentRankIdx===0){ const cap=Math.max(2,4+difficultyBias); n1=1+(Math.random()*cap|0); n2=1+(Math.random()*(cap+1-n1)|0); }
  else if(currentRankIdx===1 && op==='+'){ const cap=Math.max(3,5+difficultyBias); n1=2+(Math.random()*cap|0); n2=1+(Math.random()*(cap*2-n1)|0); }
  else if(op==='-'&&n1<n2){const t=n1;n1=n2;n2=t}
  const answer=op==='+'?n1+n2:n1-n2;
  return{n1,n2,op,answer};
}

const CHOICE_COUNTS=[4,4,4,4,5,5,5];
function digitsSwapped(n){
  if(n<10 || n>99) return null;
  const tens=Math.floor(n/10), ones=n%10;
  if(tens===ones) return null;
  return ones*10+tens;
}
function buildSmartChoiceSet(answer,count){
  const arr=[answer];
  // ヒント潰し1：十の位と一の位を入れ替えたダミー（例：24→42）を必ず1個混ぜる
  const swapped=digitsSwapped(answer);
  if(swapped!==null && swapped>=0 && !arr.includes(swapped)) arr.push(swapped);
  // ヒント潰し2：1の位が同じ・10の位が違うダミー（レベルが上がるほど増加）
  const sameLastDigitBudget=currentRankIdx>=4?2:(currentRankIdx>=2?1:0);
  let added=0;
  if(answer>=10 && sameLastDigitBudget>0){
    const tensSteps=[10,-10,20,-20].sort(()=>Math.random()-.5);
    for(const step of tensSteps){
      if(added>=sameLastDigitBudget || arr.length>=count) break;
      const v=answer+step;
      if(v>=0 && v!==answer && !arr.includes(v)){ arr.push(v); added++; }
    }
  }
  let guard=0;
  while(arr.length<count && guard<300){
    guard++;
    const delta=(Math.random()*7|0)-3;
    const f=answer+delta;
    if(f>=0 && f!==answer && !arr.includes(f)) arr.push(f);
  }
  return arr.slice(0,count).sort(()=>Math.random()-.5);
}
function getInvaderLayout(count){
  // レイアウトは常に1段固定。キーボード操作（縦一直線ショット）でも
  // 後列に隠れる的が発生しないようにする。
  let font;
  if(count<=4) font=55;
  else font=46;
  const areaW=380, itemW=font;
  const positions=[];
  const gap=count>1?(areaW-itemW)/(count-1):0;
  for(let i=0;i<count;i++) positions.push({x:10+gap*i, y:10});
  return {positions,font,rows:1};
}
function generateInvaders(){
  const q=generateQuestion();
  ans=q.answer;
  isRainbowRound=Math.random()<RAINBOW_CHANCE;
  const sign=q.op==='+'?'＋':'－';
  $('question').textContent=`${q.n1} ${sign} ${q.n2} ＝ ？`;
  playPuriSound();
  markQuestionShown();

  const count=CHOICE_COUNTS[currentRankIdx]||4;
  let choicesArr=buildSmartChoiceSet(ans,count);
  $('army').innerHTML=''; invadersData=[];
  const layout=getInvaderLayout(count);

  choicesArr.forEach((val,i)=>{
    const id=`inv_${i}`;
    const p=layout.positions[i];
    const jitter=count<=4?((Math.random()*16|0)-8):0;
    const rX=Math.max(4,Math.min(400-layout.font-4,p.x+jitter));
    const isBonus=isRainbowRound && val===ans;
    const cls=isBonus?'inv rainbow':'inv';
    const bcls=isBonus?'badge rb':'badge';
    $('army').insertAdjacentHTML('beforeend',`<div id="${id}" class="${cls}" data-val="${val}" style="left:${rX}px;top:${p.y}px;font-size:${layout.font}px">💩<span class="${bcls}">${val}</span></div>`);
    const hitH=Math.round(layout.font*1.36), hitW=layout.font;
    setTimeout(()=>{if($(id))invadersData.push({id,val,left:rX,right:rX+hitW,top:INV_TOP+p.y,bottom:INV_TOP+p.y+hitH,bonus:isBonus,type:'normal'})},50);
  });
}

function buildChoiceSet(answer,count,minOffset,maxOffset){
  const arr=[answer];
  while(arr.length<count){
    const delta=(Math.random()*(maxOffset-minOffset+1)|0)+minOffset;
    const sign=Math.random()<.5?-1:1;
    const v=answer+delta*sign;
    if(v>=0 && !arr.includes(v)) arr.push(v);
  }
  return arr.sort(()=>Math.random()-.5);

const FB_PHASE_CONF={
  1:{hp:4, choices:3, range:[6,20], ops:['+','-'], timeLimit:6000, flash:0,   enemyEvery:2600, fallSpeed:0,    label:'計算侵攻'},
  2:{hp:4, choices:4, range:[8,26], ops:['+','-'], timeLimit:2200, flash:0,   enemyEvery:2200, fallSpeed:0.55, label:'早押し包囲'},
  3:{hp:4, choices:4, range:[10,30],ops:['+','-','×'], timeLimit:3800, flash:900, enemyEvery:2000, fallSpeed:0.4,  label:'記憶演算'},
  4:{hp:5, choices:4, range:[12,36],ops:['+','-','×'], timeLimit:2600, flash:650, enemyEvery:1700, fallSpeed:0.75, label:'最終弾幕'}
};
const FB_APPROACH={
  1:{startTop:110, maxTop:155, startFont:80, maxFont:92},
  2:{startTop:114, maxTop:163, startFont:82, maxFont:94},
  3:{startTop:118, maxTop:171, startFont:84, maxFont:98},
  4:{startTop:122, maxTop:179, startFont:86, maxFont:104}
};

function fbGenQuestion(){
  const conf=FB_PHASE_CONF[fbPhase];
  const op=conf.ops[Math.random()*conf.ops.length|0];
  const [lo,hi]=conf.range;
  let n1,n2,answer;
  if(op==='×'){ n1=2+(Math.random()*8|0); n2=2+(Math.random()*8|0); answer=n1*n2; }
  else if(op==='-'){ n1=lo+(Math.random()*(hi-lo)|0); n2=lo+(Math.random()*(n1-lo+1)|0); answer=n1-n2; }
  else { n1=lo+(Math.random()*(hi-lo)|0); n2=lo+(Math.random()*(hi-lo)|0); answer=n1+n2; }
  return {n1,n2,op,answer};
}
function fbBuildChoices(answer,count){
  const set=new Set([answer]);
  const near=fbPhase>=3;
  let guard=0;
  while(set.size<count && guard<200){
    guard++;
    let delta;
    if(near){ delta=[-2,-1,1,2][Math.random()*4|0]; }
    else{ delta=((Math.random()*8|0)+1)*(Math.random()<.5?-1:1); }
    const v=answer+delta;
    if(v>=0) set.add(v);
  }
  return Array.from(set).sort(()=>Math.random()-.5);
}
function fbResetBossPosition(){
  const conf=FB_APPROACH[fbPhase];

  fbPhase=1; fbHp=FB_PHASE_CONF[1].hp; fbMaxHp=fbHp; fbMaxCombo=0; fbStartTime=performance.now();
  $('bossHpFill')?.remove(); $('boss')?.remove();
  const hp=document.createElement('div'); hp.className='boss-hp'; hp.innerHTML='<div class="boss-hp-fill" id="bossHpFill"></div><span class="boss-hp-label" id="bossHpLabel">HP '+fbHp+'</span>'; $('stage').appendChild(hp);
  const boss=document.createElement('div'); boss.className='boss'; boss.id='boss'; boss.textContent='👹'; $('stage').appendChild(boss);
  fbResetBossPosition();
  fbUpdateBossHp();
  fbSetPhaseLabel();
  $('msg').textContent='👑 ラスボス出現！ 正解してタイムアウト前に倒せ！';
  playBossSound();
  startFinalBossBGM();
  fbNextQuestion();
}
function fbSpawnChoices(q){
  const conf=FB_PHASE_CONF[fbPhase];
  ans=q.answer;
  const choices=fbBuildChoices(q.answer, conf.choices);
  $('army').innerHTML=''; invadersData=[];
  clearInterval(fbFallTimer);
  const positions4=[20,140,260,340], positions3=[40,180,320];
  const pos=conf.choices===4?positions4:positions3;
  const fbData=[];
  choices.forEach((val,i)=>{
    const id=`fb_opt_${i}_${Date.now()}`;
    const x=pos[i];
    $('army').insertAdjacentHTML('beforeend',`<div id="${id}" class="inv" data-val="${val}" style="left:${x}px;top:180px">💀<span class="badge">${val}</span></div>`);
    fbData.push({id,val,left:x,right:x+55,top:180,bottom:255,bonus:false,type:'bossOption'});
  });
  invadersData=fbData;
  if(conf.fallSpeed>0){
    fbFallTimer=setInterval(()=>{
      if(!active||!finalBossActive){ clearInterval(fbFallTimer); return; }
      invadersData.forEach(inv=>{
        inv.top+=conf.fallSpeed; inv.bottom+=conf.fallSpeed;
        const el=$(inv.id); if(el) el.style.top=inv.top+'px';
      });
      if(invadersData.length && invadersData[0].top>390){
        clearInterval(fbFallTimer);
        if(active){ active=false; fbOnWrong(true); }
      }
    },30);
  }
}
function fbStartTimeLimit(ms){
  const wrap=$('fbTimerWrap'), bar=$('fbTimerBar');
  wrap.style.display='block';
  const t0=performance.now();
  function step(){
    const elapsed=performance.now()-t0;
    const remain=Math.max(0, ms-elapsed);
    bar.style.width=(remain/ms*100)+'%';
    if(remain<=0){
      if(active && finalBossActive){ active=false; clearInterval(fbFallTimer); fbOnWrong(true); }
      return;
    }
    fbTimerRAF=requestAnimationFrame(step);
  }
  fbTimerRAF=requestAnimationFrame(step);
}
async function fbNextQuestion(){
  const q=fbGenQuestion();
  const conf=FB_PHASE_CONF[fbPhase];
  active=true;
  if(conf.flash){
    ans=q.answer;
    const sign=q.op==='×'?'×':(q.op==='+'?'＋':'－');
    $('question').textContent=`${q.n1} ${sign} ${q.n2}`;
    await new Promise(res=>setTimeout(res, conf.flash));
    if(!finalBossActive) return;
    $('question').textContent='？ ？ ？';
    fbSpawnChoices(q);
  }else{
    const sign=q.op==='×'?'×':(q.op==='+'?'＋':'－');
    $('question').textContent=`${q.n1} ${sign} ${q.n2} ＝ ？`;
    fbSpawnChoices(q);
  }
  $('fbTimerWrap').style.display='none';
  fbStartTimeLimit(conf.timeLimit);
  markQuestionShown();
  clearInterval(attackTimer);
  attackTimer=setInterval(enemyAutoAttack, conf.enemyEvery);
}
function fbOnCorrect(hitX,hitY,fastHit=false){
  comboCount++; fbMaxCombo=Math.max(fbMaxCombo, comboCount);
  let gain=100+comboCount*20;
  if(fastHit) gain=Math.round(gain*2);
  score+=gain; checkHighScore();
  fbHp=Math.max(0, fbHp-1);
  fbUpdateBossHp();
  fbRecoil();
  explodePoop(hitX,hitY,true);
  launchWeaponAnimation('win');
  playJackpotSound();
  if(fastHit) launchFastFeverEffect(hitX,hitY);
  $('msg').textContent=fastHit?`⚡爆速正解！ COMBO ${comboCount}（2倍ボーナス！ SCORE +${gain}）`:`正解！ COMBO ${comboCount}（ボスが後退した）`;
  bulletActive=false; $('laser').style.display='none';
  clearInterval(fbFallTimer); if(fbTimerRAF) cancelAnimationFrame(fbTimerRAF);
  if(fbHp<=0){ setTimeout(fbNextPhaseOrClear,500); }
  else{ setTimeout(fbNextQuestion,500); }
}
function fbOnWrong(timeout=false){
  resetCombo();
  const boss=$('boss'); if(boss){ boss.classList.add('hit'); setTimeout(()=>boss.classList.remove('hit'),150); }
  fbCreepForward();
  playFartSound();
  $('player').textContent='💀🚀'; $('player').style.transform='rotate(180deg) scale(1.2)';
  $('msg').textContent=timeout?'⏱ タイムアウト！ ボスが接近した！':'不正解！ ボスが接近した！';
  bulletActive=false; $('laser').style.display='none';
  clearInterval(fbFallTimer); if(fbTimerRAF) cancelAnimationFrame(fbTimerRAF);
  missCount++;
  if(missCount>=MISSES_TO_CONTINUE){
    stopFinalBossBGM();
    setTimeout(()=>{ finalBossActive=false; gameMode='continue'; missCount=0; start(); },900);
  }else{
    setTimeout(()=>{
      $('player').textContent='🚀'; $('player').style.transform='rotate(0deg) scale(1)';
      fbNextQuestion();
    },800);
  }
}
async function fbNextPhaseOrClear(){
  clearInterval(attackTimer);
  clearInterval(fbFallTimer);
  if(fbPhase>=4){ fbShowClear(); return; }
  fbPhase++;
  const conf=FB_PHASE_CONF[fbPhase];
  fbHp=conf.hp; fbMaxHp=fbHp;
  fbUpdateBossHp();
  fbSetPhaseLabel();
  fbResetBossPosition();
  let ruleText='';
  if(fbPhase===2) ruleText='⚡ 早押し包囲！\n時間内にタップせよ\n選択肢も落ちてくる！';
  else if(fbPhase===3) ruleText='🧠 記憶演算！\n式が消える前に覚えろ！';
  else if(fbPhase===4) ruleText='🔥 最終弾幕！\n全部同時に来るぞ！';
  $('msg').textContent='フェーズ'+fbPhase+'開始！';
  await fbShowFlashRule(ruleText,1500);
  fbNextQuestion();
}
function fbClearDanceParty(){
  const stage=$('fbDanceStage'); if(stage) stage.innerHTML='';
}
function fbLaunchDanceParty(){
  const stage=$('fbDanceStage'); if(!stage) return;
  stage.innerHTML='';
  const dancers=['💩','💩','💩','😎'];
  const positions=[20,120,220,320];
  dancers.forEach((emoji,i)=>{
    const d=document.createElement('div');
    d.className='fb-dancer';
    d.textContent=emoji;
    d.style.left=positions[i]+'px';
    d.style.animationDelay=(i*0.12)+'s';
    stage.appendChild(d);
  });
  const colors=['#ffeb3b','#00e5ff','#ff5722','#00ffcc','#ff00ea'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='fb-confetti';
    c.textContent=['🎉','✨','⭐'][i%3];
    c.style.left=(Math.random()*380)+'px';
    c.style.color=colors[i%colors.length];
    c.style.animationDuration=(1+Math.random()*1.2)+'s';
    c.style.animationDelay=(Math.random()*0.6)+'s';
    stage.appendChild(c);
  }
}
function fbShowClear(){
  active=false; finalBossActive=false;
  stopFinalBossBGM();
  if(!fbIsSurprise) finalBossCleared=true;
  clearInterval(attackTimer); clearInterval(fbFallTimer);
  $('army').innerHTML=''; invadersData=[];
  $('boss')?.remove(); $('bossHpFill')?.remove();
  $('question').textContent='👑撃破！';
  $('msg').textContent='';
  $('fbTimerWrap').style.display='none';
  $('fbPhaseLabel').textContent='';
  const elapsed=((performance.now()-fbStartTime)/1000).toFixed(1);
  if(!finalBossBestTime || Number(elapsed)<finalBossBestTime) finalBossBestTime=Number(elapsed);
  const bonusGain=fbIsSurprise?600:1000;
  rankXP=Math.min(999, rankXP+(fbIsSurprise?1:3));
  score+=bonusGain; checkHighScore();
  saveGame(); updateRankDisplay();
  playWinSound();
  $('fbResultTitle').textContent=fbIsSurprise?'奇襲クリア！':'CLEAR!';
  $('fbResultStats').innerHTML=`
    ${fbIsSurprise?'<div>⚠️ まさかの遭遇からの撃破！</div>':''}
    <div>クリアタイム: ${elapsed}秒（ベスト: ${finalBossBestTime}秒）</div>
    <div>最大コンボ: ${fbMaxCombo}</div>
    <div>SCORE +${bonusGain}（合計 ${score}）</div>`;
  $('fbResult').classList.add('show');
  fbLaunchDanceParty();
}
function fbResetAndRetry(){
  $('fbResult').classList.remove('show');
  fbClearDanceParty();
  if(fbIsSurprise){
    startFinalBossBattle(true);
  }else{
    finalBossCleared=false;
    gameMode='normal'; sessionCorrect=3;
    start();
  }
}
function fbRestartFromZero(){
  $('fbResult').classList.remove('show');
  fbClearDanceParty();
  rankXP=0; levelCycle=0; score=0; finalBossCleared=false;
  saveGame(); updateRankDisplay();
  gameMode='normal';
  start();
}
$('fbBtnRetry').addEventListener('click', fbResetAndRetry);
$('fbBtnRestart').addEventListener('click', fbRestartFromZero);

bindTouch();
loadGame();
$('soundBtn').addEventListener('click',()=>{soundEnabled=!soundEnabled;updateSoundButton();saveGame();if(soundEnabled)initAudio()});
if(window.visualViewport) window.visualViewport.addEventListener('resize',syncStageScale);
syncStageScale();
start();
</script>
</body>
